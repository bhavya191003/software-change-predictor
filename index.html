<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defect Risk Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; max-width: 1000px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .search-box { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        input[type="text"] { width: 60%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 24px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; font-weight: 600; }
        .high-risk { color: #e74c3c; font-weight: bold; }
        #loading { text-align: center; display: none; font-size: 18px; color: #7f8c8d; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Software Change Prediction Engine</h1>
    
    <div class="search-box">
        <input type="text" id="repoUrl" value="https://github.com/pallets/flask.git" placeholder="Enter GitHub Repository URL...">
        <button onclick="analyzeRepo()">Analyze Risk</button>
    </div>

    <div id="loading">⏳ Mining repository and computing statistical models... Please wait.</div>

    <div class="dashboard-grid" id="resultsArea" style="display: none;">
        <div class="card">
            <h3>🚨 Top Hotspot Files</h3>
            <table>
                <thead>
                    <tr>
                        <th>File Path</th>
                        <th>Risk Score</th>
                        <th>Entropy</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="card">
            <h3>📊 Risk Distribution (Chart.js)</h3>
            <canvas id="riskChart"></canvas>
        </div>
    </div>

    <script>
        let riskChartInstance = null;

        async function analyzeRepo() {
            const url = document.getElementById('repoUrl').value;
            const loading = document.getElementById('loading');
            const resultsArea = document.getElementById('resultsArea');
            
            loading.style.display = 'block';
            resultsArea.style.display = 'none';

            try {
                // Call your local FastAPI Python server
                const response = await fetch("https://software-change-predictor.onrender.com/analyze", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const json = await response.json();
                const data = json.data.slice(0, 5); // Grab top 5 files

                populateTable(data);
                drawChart(data);

                loading.style.display = 'none';
                resultsArea.style.display = 'grid';

            } catch (error) {
                alert("Error connecting to the API. Make sure your Python server is running!");
                loading.style.display = 'none';
            }
        }

        function populateTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(file => {
                const row = `<tr>
                    <td>${file.file_path.split('/').pop()}</td>
                    <td class="high-risk">${file.risk_score.toFixed(3)}</td>
                    <td>${file.entropy.toFixed(2)}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function drawChart(data) {
            const ctx = document.getElementById('riskChart').getContext('2d');
            
            // Destroy old chart if it exists so we can draw a new one
            if (riskChartInstance) { riskChartInstance.destroy(); }

            const labels = data.map(f => f.file_path.split('/').pop());
            const scores = data.map(f => f.risk_score);

            riskChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Composite Risk Score',
                        data: scores,
                        backgroundColor: 'rgba(231, 76, 60, 0.7)',
                        borderColor: 'rgba(192, 57, 43, 1)',
                        borderWidth: 1
                    }]
                },
                options: { scales: { y: { beginAtZero: true } } }
            });
        }
    </script>
</body>
</html>
